<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take a Sign — Ahsanul Hafiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --power-red: #E81E25; --power-red-hover: #ad1b1e;
    --heritage-navy: #6A0C0D; --olp-tobermory: #5FD7DC;
    --text-dark: #1a1a1a; --text-muted: #525252;
    --border-light: rgba(106, 12, 13, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--text-dark); background: transparent;
    line-height: 1.5; padding: 16px; -webkit-font-smoothing: antialiased;
  }
  .hafiz-form {
    background: #fff; border-radius: 1.25rem;
    border: 1px solid var(--border-light);
    box-shadow: 0 12px 32px rgba(26, 43, 68, 0.08);
    padding: 1.75rem; max-width: 560px; margin: 0 auto;
  }
  .hafiz-form h2 {
    font-size: 1.25rem; font-weight: 700;
    color: var(--heritage-navy);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 0 0 0.4rem;
  }
  .prompt { font-size: 1.02rem; color: var(--heritage-navy); font-weight: 600; margin: 0 0 0.9rem; }
  .disclaimer {
    background: rgba(95, 215, 220, 0.12);
    border: 1px solid rgba(95, 215, 220, 0.45);
    border-radius: 0.6rem; padding: 0.85rem 1rem;
    font-size: 0.92rem; color: var(--text-dark);
    margin-bottom: 1rem; line-height: 1.55;
  }
  .disclaimer label {
    display: flex; align-items: flex-start; gap: 0.5rem;
    margin-top: 0.6rem; font-weight: 600; cursor: pointer;
  }
  .disclaimer label input { margin-top: 0.25rem; }
  .options { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 0.6rem; }
  @media (min-width: 520px) { .options { flex-direction: row; flex-wrap: wrap; }
    .options > button { flex: 1 1 auto; } }
  .options button {
    text-align: left; padding: 0.8rem 1rem; border-radius: 0.6rem;
    background: #fff; border: 1.5px solid var(--border-light);
    font: inherit; color: var(--text-dark);
    cursor: pointer; transition: all 0.15s ease; font-weight: 500;
  }
  .options button:hover:not(:disabled) {
    border-color: var(--power-red); background: rgba(232, 30, 37, 0.05);
  }
  .options button:disabled { opacity: 0.5; cursor: not-allowed; }
  .options button.selected {
    border-color: var(--power-red); background: rgba(232, 30, 37, 0.08);
    color: var(--power-red); font-weight: 600;
  }
  form { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem; }
  input, textarea { width: 100%; padding: 0.75rem 0.95rem; border-radius: 0.55rem;
    border: 1px solid rgba(26, 43, 68, 0.2); background: #fff; color: var(--text-dark);
    font: inherit; font-size: 16px; }
  textarea { min-height: 80px; resize: vertical; }
  .field-label {
    font-size: 0.82rem; font-weight: 600; color: var(--heritage-navy);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: block; margin-bottom: 0.35rem;
  }
  .size-group { display: flex; gap: 0.65rem; }
  .radio-card {
    flex: 1; display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 0.9rem; border: 1.5px solid var(--border-light);
    border-radius: 0.55rem; cursor: pointer; font-weight: 500; background: #fff;
  }
  .radio-card:hover { border-color: var(--power-red); }
  .radio-card:has(input:checked) {
    border-color: var(--power-red); background: rgba(232, 30, 37, 0.06);
    color: var(--power-red);
  }
  button[type="submit"] {
    padding: 0.9rem 1.25rem; border-radius: 0.55rem;
    background: var(--power-red); color: #fff; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.85rem;
    border: none; cursor: pointer; transition: background 0.15s ease;
  }
  button[type="submit"]:hover { background: var(--power-red-hover); }
  .is-hidden { display: none !important; }
  .success {
    display: none; margin-top: 1rem;
    padding: 0.85rem 1rem;
    background: rgba(95, 215, 220, 0.20);
    border: 1px solid var(--olp-tobermory);
    border-radius: 0.6rem;
    color: var(--heritage-navy); font-weight: 600; font-size: 0.95rem;
  }
  .success.show { display: block; }
</style>
</head>
<body>
  <div class="hafiz-form">
    <h2>Take a Sign</h2>
    <p class="prompt">Show your support and build momentum in the riding.</p>
    <div class="disclaimer">
      <strong>Heads up:</strong> Signs only go up once the election is officially called, and we cannot place signs at apartment buildings at this time.
      <label><input type="checkbox" id="ack"> I understand.</label>
    </div>
    <div class="options" id="options">
      <button type="button" data-answer="yes" disabled>Yes — I'll take a sign</button>
      <button type="button" data-answer="no" disabled>Not at this time</button>
    </div>
    <form id="sign-form" class="is-hidden" novalidate>
      <input name="first_name" type="text" required placeholder="First name *" autocomplete="given-name">
      <input name="last_name" type="text" required placeholder="Last name *" autocomplete="family-name">
      <input name="email" type="email" required placeholder="Email address *" autocomplete="email">
      <input name="cell_phone" type="tel" required placeholder="Cell phone *" autocomplete="tel">
      <div>
        <span class="field-label">Sign size *</span>
        <div class="size-group">
          <label class="radio-card"><input type="radio" name="sign_size" value="big" required> <span>Big sign</span></label>
          <label class="radio-card"><input type="radio" name="sign_size" value="small"> <span>Small sign</span></label>
        </div>
      </div>
      <input name="sign_address" type="text" required placeholder="Street address for sign placement *" autocomplete="street-address">
      <textarea name="sign_notes" placeholder="Installation notes — e.g. corner lot (request two signs), please avoid the garden, leave at the side door, etc."></textarea>
      <button type="submit">Request a sign</button>
    </form>
    <div id="success" class="success"></div>
  </div>

<script>
(function() {
  var GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxJ-EHsohq-k2u2Vc2fmkoskfrDlyul8I0FV-S2PeMKsOeaGyfyhk-zud_egF8xaAcShw/exec';
  var STORAGE_KEY = 'hafiz_supporter_v1';
  var SHARED_FIELDS = ['first_name', 'last_name', 'email', 'cell_phone'];

  var state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  if (!state.session_id) {
    state.session_id = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'sid-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  save();

  function post(formType, extra) {
    var payload = Object.assign({
      formType: formType, submittedAt: new Date().toISOString(),
      userAgent: navigator.userAgent
    }, state, extra || {});
    var body = JSON.stringify(payload);
    if (navigator.sendBeacon) {
      try {
        var blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
        if (navigator.sendBeacon(GAS_ENDPOINT, blob)) return;
      } catch (e) {}
    }
    fetch(GAS_ENDPOINT, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body
    }).catch(function(){});
  }

  var ack = document.getElementById('ack');
  var optBtns = document.querySelectorAll('#options button');
  var signForm = document.getElementById('sign-form');
  var success = document.getElementById('success');

  SHARED_FIELDS.forEach(function(name) {
    var input = signForm.querySelector('input[name="' + name + '"]');
    if (input && state[name]) input.value = state[name];
  });

  function syncBtns() {
    optBtns.forEach(function(b){ b.disabled = !ack.checked; });
  }
  ack.addEventListener('change', syncBtns);
  syncBtns();

  optBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.disabled) return;
      optBtns.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      var answer = btn.getAttribute('data-answer');
      state.sign_request = answer; save();
      if (answer === 'yes') {
        signForm.classList.remove('is-hidden');
        success.classList.remove('show');
      } else {
        signForm.classList.add('is-hidden');
        post('sign_request', { answer: 'no' });
        success.textContent = 'Recorded — thanks for considering.';
        success.classList.add('show');
      }
    });
  });

  signForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData(signForm);
    SHARED_FIELDS.forEach(function(name) {
      var v = fd.get(name);
      if (v != null) state[name] = (v + '').trim();
    });
    state.sign_size = fd.get('sign_size');
    state.sign_address = (fd.get('sign_address') || '').trim();
    state.sign_notes = (fd.get('sign_notes') || '').trim();
    save();
    post('sign_request', { answer: 'yes' });
    signForm.classList.add('is-hidden');
    success.textContent = 'Sign requested — someone from the campaign will be in touch about delivery.';
    success.classList.add('show');
  });

  function postHeight() {
    try { parent.postMessage({ hafizFormHeight: document.body.scrollHeight }, '*'); } catch (e) {}
  }
  window.addEventListener('load', postHeight);
  new ResizeObserver(postHeight).observe(document.body);
})();
</script>
</body>
</html>
