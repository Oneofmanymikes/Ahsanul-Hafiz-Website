<!DOCTYPE html>
<html lang="en">

<title>Ahsanul Hafiz — Ontario Liberal Candidate for Scarborough Southwest</title>
<meta name="description" content="Ahsanul Hafiz — Ontario Liberal Candidate for Scarborough Southwest. Our campaign website is coming soon. Sign up to volunteer.">

<style>
  :root {
    --olp-cardinal: #E81E25;
    --olp-deep-maple: #6A0C0D;
    --power-red-hover: #ad1b1e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff; padding: 32px 20px;
    background: linear-gradient(160deg, var(--olp-cardinal) 0%, var(--olp-deep-maple) 100%);
    -webkit-font-smoothing: antialiased;
  }
  .logo { width: 84px; height: auto; margin-bottom: 22px;
          background: #fff; border-radius: 14px; padding: 10px; }
  h1 { font-family: Oswald, Inter, sans-serif; text-transform: uppercase;
       letter-spacing: 1px; font-size: clamp(2rem, 6vw, 3.2rem); margin: 0; line-height: 1.05; }
  .role { font-size: clamp(0.95rem, 2.4vw, 1.25rem); font-weight: 600;
          letter-spacing: 0.08em; text-transform: uppercase; margin-top: 12px;
          color: rgba(255,255,255,0.92); }
  .divider { width: 200px; height: 5px; border-radius: 999px; margin: 24px auto;
             background: rgba(255,255,255,0.55); }
  .soon { font-size: clamp(1.05rem, 2.6vw, 1.4rem); font-weight: 500;
          max-width: 540px; margin: 0 auto; color: rgba(255,255,255,0.95); }
  .cta {
    display: inline-block; margin-top: 30px; background: #fff; color: var(--olp-deep-maple);
    text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 15px; padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 14px 35px rgba(0,0,0,0.25); transition: transform 0.1s, background 0.15s;
  }
  .cta:hover { background: #f3f3f3; transform: translateY(-1px); }
  .contact { margin-top: 34px; font-size: 14px; color: rgba(255,255,255,0.9);
             display: flex; gap: 8px 22px; flex-wrap: wrap; justify-content: center; }
  .contact a { color: #fff; text-decoration: none; font-weight: 600; }
  .contact a:hover { text-decoration: underline; }
  .social { margin-top: 20px; display: flex; gap: 16px; justify-content: center; }
  .social a { color: #fff; opacity: 0.9; }
  .social a:hover { opacity: 1; }
  .social svg { width: 24px; height: 24px; fill: currentColor; }
  footer { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.7); }
</style>
