<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Walk — sign up for a GOTV shift</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="6; url=/gotv/">
<link rel="canonical" href="https://votehafiz.ca/gotv/">
<link rel="icon" href="/apple-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap">
<style>
 :root{--brand:#E81E25;--accent:#6A0C0D;--ink:#1a1a1a;--mut:#525252;--line:#e3e3e3;--bg:#f7f7f7}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;
      font-size:17px;line-height:1.5;display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:24px}
 .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 26px;
      max-width:520px;text-align:center;box-shadow:0 8px 24px rgba(26,43,68,.06)}
 h1{color:var(--accent);font-size:26px;margin:0 0 8px;line-height:1.2}
 p{color:var(--mut);margin:0 0 18px}
 .go{display:inline-block;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;
     border-radius:10px;padding:14px 24px;min-height:44px}
 .go:hover{background:#ad1b1e}
 .small{font-size:14px;margin:16px 0 0}
</style>
</head>
<body>
 <div class="box">
  <h1>The Big Walk has finished</h1>
  <p>Thank you to everyone who walked with us.</p>
  <p><b>Voting is happening now.</b> Advance polls run 26–28 August and election day is
     Thursday 3 September — we need people on doors and phones.</p>
  <a class="go" href="/gotv/">Sign up for a GOTV shift</a>
  <p class="small">Taking you there in a few seconds. <a href="/">votehafiz.ca</a></p>
 </div>
</body>
</html>
